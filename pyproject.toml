[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deimos-stream"
version = "0.6.0"
description = "Universal Low-VRAM Sparse MoE & LLM Merkle-Paged Streaming Engine (MLX • CUDA • C++17)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Martian Academy", email = "research@martian.academy" }]
keywords = [
    "moe",
    "mixture-of-experts",
    "llm",
    "mlx",
    "apple-silicon",
    "low-vram",
    "merkle-tree",
    "paged-memory",
    "offloading",
    "olmoe",
    "qwen-moe",
    "mixtral",
    "deepseek",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.0",
    "safetensors>=0.4.5",
    "tokenizers>=0.19.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "mlx>=0.22.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.21.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://github.com/martianacademy/deimos-stream"
Repository = "https://github.com/martianacademy/deimos-stream"
Issues = "https://github.com/martianacademy/deimos-stream/issues"

[project.optional-dependencies]
cuda = [
    "torch>=2.4.0",
    "transformers>=5.0.0",
    "huggingface-hub>=0.26.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
deimos-stream = "deimos_stream.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deimos_stream"]
exclude = [
    "src/deimos_stream/native/*.dylib",
    "src/deimos_stream/native/*.so",
]

[tool.hatch.build.targets.wheel.force-include]
"include/deimos_stream.h" = "deimos_stream/include/deimos_stream.h"
"include/deimos_sha256.h" = "deimos_stream/include/deimos_sha256.h"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
